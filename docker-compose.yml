services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: safe-code-harness-v2:local
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/workspaces
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/runs', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
