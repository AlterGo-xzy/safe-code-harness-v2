name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e "backend[dev]"
      - name: Run backend tests
        run: |
          New-Item -ItemType Directory -Force -Path .pytest-tmp | Out-Null
          .\.venv\Scripts\python.exe -m pytest backend/tests --basetemp .pytest-tmp\github -q
      - name: Run deterministic mechanism demos
        run: .\scripts\run_demos.ps1
      - name: Install frontend
        working-directory: frontend
        run: npm.cmd ci --ignore-scripts
      - name: Run frontend tests
        working-directory: frontend
        run: npm.cmd test
      - name: Build frontend
        working-directory: frontend
        run: npm.cmd run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx.cmd playwright install chromium
      - name: Run browser E2E
        working-directory: frontend
        run: npm.cmd run test:e2e

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag safe-code-harness-v2:ci .
